<!DOCTYPE html>
<html>
  <body>
    <h1>Brak dostępu</h1>
    <br />
    <p>
      Dostęp do węzła {{ node.id }} jest zabroniony. <br />
      Odeślij sekretne hasło w celu uzyskania dostępu.
    </p>
    <form action="/validate_password/{{ node.href }}" method="post">
      <label for="password">Hasło:</label>
      <input type="password" id="password" name="password" required />
      <button type="submit">Zatwierdź</button>
    </form>
  </body>
</html>
